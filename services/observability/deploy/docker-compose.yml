# 상시 관측 스택 로컬 기동(설계 §6 1~4단계).
#
# 전부 OSS이므로 비용은 ₩0이다([COST-05]). vmalert / alertmanager / mailhog는
# 알림(7단계)에서 추가한다.
#
# 개발 편의를 위해 내부 홉이 평문이다: obsplane은 OBS_INTERNAL_INSECURE로,
# 게이트웨이는 klaroauth.tls.insecure로 명시적으로 그렇게 요청해야 한다.
# 프로덕션은 두 곳 모두 mTLS 번들을 넣는다(CLAUDE.md: 내부 mTLS 필수).
#
# 평문이라도 인증은 살아 있다(F-3): 내부 평면의 모든 라우트는 검증된 클라이언트
# 인증서 또는 KLARO_INTERNAL_TOKEN 중 하나를 요구한다. 그래서 obsplane·게이트웨이·
# vmalert 세 곳이 같은 토큰을 공유한다 — 하나만 바꾸면 그 경로만 401이 된다.
# 실제 값은 `KLARO_INTERNAL_TOKEN=... docker compose up`으로 덮어쓰고, 아래
# 기본값은 로컬 전용이다.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: klaro
      POSTGRES_PASSWORD: klaro
      POSTGRES_DB: klaro_obs
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klaro"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6380:6379"]

  obsplane:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      # 요청 처리 롤은 NOSUPERUSER/NOBYPASSRLS여야 한다(0000 마이그레이션이 생성).
      OBS_DATABASE_URL: postgres://klaro_obs_app:klaro_obs_app@postgres:5432/klaro_obs?sslmode=disable
      # 마이그레이션은 DDL/CREATE ROLE 권한이 필요하므로 별도 관리자 DSN을 쓴다.
      OBS_MIGRATE_DATABASE_URL: postgres://klaro:klaro@postgres:5432/klaro_obs?sslmode=disable
      OBS_REDIS_ADDR: redis:6379
      OBS_ADDR: ":8090"
      OBS_INTERNAL_ADDR: ":8443"
      # 배포 프로파일. production으로 두면 아래 개발용 완화(평문 내부 플레인,
      # 인증 스텁, sslmode=disable)가 전부 기동 실패로 막힌다.
      OBS_ENV: development
      # 개발 전용 평문 내부 플레인. 프로덕션은 OBS_TLS_* 번들로 대체한다.
      # 평문은 전송만 완화한다 — 내부 평면은 이 토큰으로 계속 인증한다(F-3).
      OBS_INTERNAL_INSECURE: "true"
      OBS_INTERNAL_TOKEN: ${KLARO_INTERNAL_TOKEN:-dev-internal-token-change-me-0123456789}
      # 공개 평면 인증 = 서명된 HS256 JWT. 프로덕션과 **같은 코드 경로**다
      # (tenancy.JWTAuthenticator) — 다른 건 시크릿의 출처뿐이다. 개발 스텁
      # (OBS_DEV_AUTH)은 의도적으로 쓰지 않는다: 스텁을 켜면 JWT 검증이
      # 우회되므로, 로컬에서 잘 되던 토큰 경로가 프로덕션에서 처음 실행되는
      # 코드가 된다.
      #
      # 토큰 발급: deploy/scripts/dev-token.mjs (org_id·role·exp·iss·aud).
      # 실제 시크릿은 KLARO_DEV_JWT_SECRET=... docker compose up 으로 덮어쓴다.
      OBS_JWT_ALG: HS256
      OBS_JWT_HS_SECRET: ${KLARO_DEV_JWT_SECRET:-klaro-dev-jwt-secret-change-me-0123456789}
      OBS_JWT_ISSUER: klaro-dev
      OBS_JWT_AUDIENCE: klaro-obs
      # 브라우저 대시보드는 다른 오리진(:3100)에서 돈다. 이게 없으면 모든 fetch가
      # 핸들러에 닿기도 전에 브라우저에서 막히고, 화면에는 "백엔드 없음"으로 보인다.
      # 프로덕션 프로파일은 이 변수를 거부한다(config.validateDevCORS).
      OBS_DEV_CORS_ORIGINS: http://localhost:3100
      # Explorer 백엔드(설계 HOW-2). 비어 있으면 해당 신호는 "백엔드 없음"으로
      # 응답한다 — 빈 URL로 다이얼하지 않는다.
      OBS_VMSELECT_URL: http://vmselect:8481
      OBS_TEMPO_URL: http://tempo:3200
      OBS_LOKI_URL: http://loki:3100
      # 알림: CP가 룰 파일을 쓰고 vmalert가 읽는다(공유 볼륨).
      OBS_RULE_FILE: /var/lib/klaro/rules/klaro.yaml
      OBS_VMALERT_RELOAD_URL: http://vmalert:8880/-/reload
      OBS_RULE_SYNC_INTERVAL_SEC: "15"
      OBS_SMTP_ADDR: mailhog:1025
      OBS_DASHBOARD_BASE_URL: http://localhost:3100
      # 보존/과금 잡 주기. 개발에서는 짧게 돌려 관측 가능하게 한다.
      OBS_RETENTION_INTERVAL_SEC: "3600"
      OBS_USAGE_INTERVAL_SEC: "30"
    ports: ["8090:8090", "8443:8443"]
    volumes: ["obs-rules:/var/lib/klaro/rules"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      vmselect: { condition: service_started }
      tempo: { condition: service_started }
      loki: { condition: service_started }

  # --- 수집 게이트웨이 -----------------------------------------------------
  otel-collector:
    build:
      context: ../collector
      dockerfile: Dockerfile
    command: ["--config", "/etc/klaro/otel-collector.yaml"]
    environment:
      # obsplane의 OBS_INTERNAL_TOKEN과 같은 값이어야 한다. 설정 파일에는
      # ${env:KLARO_INTERNAL_TOKEN}로만 들어가므로 비밀은 파일에 남지 않는다.
      KLARO_INTERNAL_TOKEN: ${KLARO_INTERNAL_TOKEN:-dev-internal-token-change-me-0123456789}
    volumes:
      - ./otel-collector.yaml:/etc/klaro/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP/gRPC (SDK)
      - "4318:4318"   # OTLP/HTTP (SDK)
      - "13133:13133" # health_check
    depends_on:
      obsplane: { condition: service_started }
      vminsert: { condition: service_started }
      tempo: { condition: service_started }
      loki: { condition: service_started }

  # --- 호스트 메트릭 에이전트 ----------------------------------------------
  #
  # 인프라 화면(P1b)이 실제 데이터를 갖도록 로컬 호스트의 cpu/memory/disk/
  # network/load를 15초마다 게이트웨이로 보낸다. 게이트웨이가 아니라 별도
  # 컨테이너인 이유는 otel-hostmetrics.yaml 머리말에 적었다(스크레이프에는
  # 테넌트를 실어 줄 요청 컨텍스트가 없다).
  #
  # KLARO_OBS_KEY가 있어야 동작한다. seed-dev.sh가 키를 발급한 뒤 이 서비스만
  # 다시 띄우므로 보통은 직접 넣을 일이 없다:
  #   ./deploy/scripts/seed-dev.sh
  # 키 없이 뜨면 게이트웨이가 401로 거절하고 에이전트는 재시도만 한다 —
  # 조용히 다른 org로 새는 경로는 없다.
  otel-hostagent:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config", "/etc/klaro/otel-hostmetrics.yaml"]
    environment:
      KLARO_OBS_KEY: ${KLARO_OBS_KEY:-}
      KLARO_GATEWAY_ENDPOINT: otel-collector:4317
      KLARO_HOST_ENV: ${KLARO_HOST_ENV:-dev}
      # 컨테이너 이름이 아니라 사람이 읽을 수 있는 호스트 이름으로 등록되게
      # 한다. 이 값이 observability_hosts.host_ident이자 시리즈의 instance
      # 라벨이 되므로, 재기동마다 바뀌는 컨테이너 ID를 쓰면 호스트가 매번
      # 새 호스트로 보이고 호스트 쿼터도 함께 부풀어 오른다.
      OTEL_RESOURCE_ATTRIBUTES: host.name=${KLARO_HOST_NAME:-klaro-dev-host}
    # 호스트의 /proc·/sys를 보려면 아래 마운트가 필요하다. Docker Desktop에서는
    # 리눅스 VM의 값이 보이고, 리눅스 서버에서는 진짜 호스트 값이 보인다.
    # 마운트를 생략해도 컨테이너 자신의 /proc을 읽어 실제 수치가 흐르므로,
    # 개발에서는 이식성을 위해 마운트하지 않는다(프로덕션 배포는 /hostfs를
    # 붙이고 config에 root_path를 준다).
    restart: unless-stopped
    depends_on:
      otel-collector: { condition: service_started }
    volumes:
      - ./otel-hostmetrics.yaml:/etc/klaro/otel-hostmetrics.yaml:ro

  # --- 메트릭: VictoriaMetrics 클러스터 ------------------------------------
  # AccountID 멀티테넌시는 클러스터 구성에만 있다(단일 노드에는 없다).
  # 설계 HOW-8이 요구하는 저장소 계층 격리를 쓰려면 이 3종이 필요하다.
  vmstorage:
    image: victoriametrics/vmstorage:v1.150.0-cluster
    command:
      - "-retentionPeriod=90d"   # 최대 플랜 기준. org별 보존은 CP가 집행(HOW-5).
      - "-storageDataPath=/storage"
    volumes: ["vmstorage-data:/storage"]

  vminsert:
    image: victoriametrics/vminsert:v1.150.0-cluster
    command:
      - "-storageNode=vmstorage:8400"
      # 멀티테넌시는 헤더로 한다(-enableMultitenancyViaHeaders, v1.150 기본 on):
      # 테넌트가 AccountID 헤더로 오므로 org마다 익스포터를 복제할 필요가 없다.
    ports: ["8480:8480"]
    depends_on: [vmstorage]

  vmselect:
    image: victoriametrics/vmselect:v1.150.0-cluster
    command:
      - "-storageNode=vmstorage:8401"
      # 기본 30초 지연은 스크레이프 파이프라인을 위한 값이다. 우리 경로는 push라
      # 방금 들어온 샘플이 30초간 조회에 안 보이면 Explorer가 고장난 것처럼 보인다.
      - "-search.latencyOffset=1s"
    ports: ["8481:8481"]
    depends_on: [vmstorage]

  # --- 알림: vmalert + MailHog ---------------------------------------------
  #
  # 스파이크 결론(웨이브4): vmalert v1.150 OSS에는 -clusterMode도 룰그룹 tenant:
  # 필드도 없다. 그래서 org별 인스턴스를 띄우는 대신 인스턴스 하나 + 멀티테넌트
  # datasource로 두고, 격리는 이미 검증된 두 층으로 세운다:
  #   읽기 = CP가 렌더할 때 expr에 klaro_org_id 매처를 강제 주입
  #   쓰기 = 룰 labels의 vm_account_id로 org 테넌트에 remote-write
  # 실측으로 2개 org의 롤업 값이 섞이지 않음을 확인했다.
  vmalert:
    image: victoriametrics/vmalert:v1.150.0
    command:
      - "-datasource.url=http://vmselect:8481/select/multitenant/prometheus"
      - "-remoteWrite.url=http://vminsert:8480/insert/multitenant/prometheus"
      - "-remoteRead.url=http://vmselect:8481/select/multitenant/prometheus"
      - "-rule=/etc/vmalert/rules/*.yaml"
      - "-evaluationInterval=15s"
      # notifier.url에 /api/v2/alerts가 붙는다. Alertmanager를 중간에 두지 않고
      # CP가 그 API를 직접 받는다 — 같은 데이터를 전달만 하는 컨테이너를 하나
      # 줄인다.
      - "-notifier.url=http://obsplane:8443/internal/alerts"
      # 내부 평면은 알림 경로에서도 인증한다(F-3). vmalert는 이 플래그로
      # Authorization: Bearer를 붙인다 — 없으면 모든 알림이 401로 사라진다.
      - "-notifier.bearerToken=${KLARO_INTERNAL_TOKEN:-dev-internal-token-change-me-0123456789}"
      - "-rule.resendDelay=1m"
    volumes: ["obs-rules:/etc/vmalert/rules:ro"]
    ports: ["8880:8880"]
    # 첫 기동 때 obsplane이 룰 파일을 쓰기 전이면 vmalert가 먼저 죽는다.
    # 재시작으로 넘긴다(개발 편의).
    restart: unless-stopped
    depends_on:
      obsplane: { condition: service_started }

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]

  # --- 트레이스 / 로그 ------------------------------------------------------
  tempo:
    image: grafana/tempo:2.9.0
    user: root      # 로컬 블록/WAL 디렉터리 쓰기
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]

  loki:
    image: grafana/loki:3.5.7
    user: root
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    # 호스트 3101 — 3100은 대시보드 dev 서버(apps/observability-dashboard)가 쓴다.
    # 컨테이너 안 포트는 그대로이므로 OBS_LOKI_URL(http://loki:3100)은 영향 없다.
    ports: ["3101:3100"]

volumes:
  # CP가 쓰고 vmalert가 읽는 룰 파일. 원자적 교체(temp+rename)로 갱신하므로
  # vmalert가 반쯤 쓰인 파일을 읽는 일은 없다.
  obs-rules:
  vmstorage-data:
  tempo-data:
  loki-data:
