# Loki — 로그 저장소. auth_enabled: true 이면 X-Scope-OrgID가 필수가 되고,
# 헤더 없는 요청은 거부된다(설계 HOW-8: 저장소 계층에서 격리 강제).
auth_enabled: true

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP 로그의 resource/scope 속성을 structured metadata로 보존한다.
  allow_structured_metadata: true
  # 개발 로컬 디스크 상한. 플랜별 보존은 CP retentionjob이 별도로 집행한다.
  retention_period: 24h
  # retentionjob이 org별 시간범위 삭제를 요청할 수 있게 한다. 세 백엔드 중
  # 시간범위 삭제가 가능한 건 Loki뿐이다.
  deletion_mode: filter-and-delete

  # klaro.org_id를 스트림 라벨로 색인한다.
  #
  # OTLP 수집에서 Loki는 service.name 등 일부만 라벨로 승격하고 나머지 리소스
  # 속성은 structured metadata로 넣는다. structured metadata는 셀렉터로 매칭할
  # 수 없어서, explorer가 강제 주입하는 {klaro_org_id="…"} 매처가 아무것도
  # 고르지 못한다 — 조회 결과가 항상 비어 보인다.
  #
  # 카디널리티 비용은 없다(org당 값 하나). 격리의 1차 방어선은 여전히
  # X-Scope-OrgID(auth_enabled)이고, 이 라벨은 2차 방어선이다.
  otlp_config:
    resource_attributes:
      ignore_defaults: false
      attributes_config:
        - action: index_label
          attributes:
            - klaro.org_id

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

