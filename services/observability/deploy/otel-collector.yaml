# klaro 수집 게이트웨이 (설계 §4.1 · §6 4단계)
#
#   SDK --OTLP--> [이 게이트웨이] --> VictoriaMetrics(AccountID=org)
#                                 --> Tempo / Loki (X-Scope-OrgID=org)
#                                 --> obsplane /internal/live-ingest (라이브 복제)
#
# 테넌트는 SDK가 보낸 값이 아니라 klaroauth가 컨트롤 플레인에서 받아온 값이다.
# klaroauth가 클라이언트가 보낸 테넌트 헤더를 대소문자 무시로 지우고 klarotenant가
# vm_account_id 라벨을 덮어쓰므로, 헤더든 라벨든 위조로 다른 org에 쓰는 경로가 없다.
#
# 이 파일은 개발(compose) 기준선이고 내부 홉이 평문이다. 프로덕션은 이 파일에
# otel-collector.prod.yaml을 겹쳐서 SDK↔Collector mTLS를 강제한다:
#   klaro-otelcol --config otel-collector.yaml --config otel-collector.prod.yaml
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  # ① 수집 인증: klaro-obs-key → CP 검증(결과 캐시)
  klaroauth:
    endpoint: http://obsplane:8443/internal/authz/ingest-key
    header: klaro-obs-key
    # 캐시 TTL은 폐기가 반영되기까지의 최대 지연이기도 하다.
    cache_ttl: 30s
    negative_cache_ttl: 5s
    timeout: 3s
    tls:
      # 개발 compose 전용. 프로덕션은 otel-collector.prod.yaml이 이 값을 덮어쓴다
      # (CLAUDE.md: 내부 mTLS 필수). insecure를 명시적으로 켜야만 평문이 되므로,
      # 번들이 없다고 조용히 강등되는 경로는 없다(klaroauth Validate).
      insecure: true

  # ② Tempo·Loki 테넌시: 컨텍스트의 org를 X-Scope-OrgID 헤더로 옮긴다.
  headers_setter:
    headers:
      - action: upsert
        key: X-Scope-OrgID
        from_context: x-scope-orgid

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # include_metadata는 klaroauth가 없어도 원본 헤더를 컨텍스트에 남기게 한다.
        include_metadata: true
        auth:
          authenticator: klaroauth
        # tls 블록이 없다 = 평문. 개발 전용이다. 프로덕션은 이 파일을 고치지 않고
        # otel-collector.prod.yaml을 --config로 덧붙여 mTLS를 켠다(그 파일의
        # "강제 지점" 주석이 어느 키가 강제 스위치인지 적어둔다). 여기 주석으로
        # 적어두지 않는 이유: 한 번도 적용된 적 없는 설정이 옆에 남으면 켜져
        # 있다고 착각하기 쉽다.
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true
        auth:
          authenticator: klaroauth

processors:
  memory_limiter:
    check_interval: 2s
    limit_percentage: 75
    spike_limit_percentage: 20

  # ③ 테넌트 각인. batch보다 반드시 앞에 와야 한다 — batch는 요청 컨텍스트를
  #    합치므로, 그 뒤에서는 어느 org의 데이터인지 더 이상 알 수 없다.
  klarotenant:
    vm_project_id: 0
    # 테넌트가 없으면 배치를 버린다. 라벨 없는 메트릭은 VictoriaMetrics의
    # 기본 계정(모든 org 공용 버킷)으로 들어가므로, 유실보다 나쁜 결과가 된다.
    require_tenant: true

  # ④ 과금 계량(BILL-03). 데이터를 건드리지 않고 세기만 한다 — 쿼터 초과는
  #    차단이 아니라 청구 항목이다(§7-1).
  klarousage:
    endpoint: http://obsplane:8443/internal/usage
    flush_interval: 15s
    tls:
      # 개발 compose 전용. 프로덕션은 otel-collector.prod.yaml이 klaroauth와
      # 동일한 mTLS 번들로 덮어쓴다.
      insecure: true

  batch:
    # 라이브 대시보드 ≤2초(APM-02 / HOW-7)에 맞춘 플러시 주기.
    timeout: 2s
    send_batch_size: 8192
    send_batch_max_size: 16384
    # 테넌트 메타데이터를 배치 키로 삼는다. 이게 없으면 headers_setter가
    # 읽을 값이 사라지고 여러 org가 한 배치로 합쳐진다.
    metadata_keys: [klaro-org-id, klaro-vm-account-id, x-scope-orgid]
    metadata_cardinality_limit: 1000

exporters:
  # 메트릭: vminsert 멀티테넌트 쓰기.
  #
  # 테넌트는 klarotenant가 리소스 속성으로 붙인 vm_account_id 라벨로 전달한다
  # (resource_to_telemetry_conversion이 라벨로 변환하고, vminsert가 라우팅에
  # 쓴 뒤 시리즈에서 제거한다).
  #
  # 헤더(headers_setter)로 하지 않는 이유: prometheusremotewrite 익스포터는
  # export를 다른 고루틴에서 수행하고 그 과정에서 요청의 client 메타데이터가
  # 사라진다. 그러면 AccountID 헤더가 빠지고 vminsert는 기본 계정(0 — 전 org
  # 공용 버킷)에 쓴다. 에러도 남지 않는 조용한 크로스테넌트 혼합이다.
  # 실측: 헤더 방식에서 target_info만 org 테넌트에 들어가고 실제 시리즈는
  # 계정 0으로 갔다. 라벨은 데이터에 실려 모든 비동기 홉을 살아서 통과한다.
  # (Tempo/Loki는 otlp/otlphttp 익스포터가 컨텍스트를 유지하므로 헤더로 충분하다.)
  prometheus_remote_write/vm:
    endpoint: http://vminsert:8480/insert/multitenant/prometheus/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
    remote_write_queue:
      enabled: true
    tls:
      insecure: true

  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    auth:
      authenticator: headers_setter

  otlp_http/loki:
    logs_endpoint: http://loki:3100/otlp/v1/logs
    auth:
      authenticator: headers_setter

  # 라이브 복제(HOW-7): CP가 OTLP/JSON을 org별로 쪼개 Redis에 publish한다.
  # WS fan-out은 설계 §6 5단계.
  otlp_http/live:
    metrics_endpoint: http://obsplane:8443/internal/live-ingest
    encoding: json
    # 라이브 뷰는 소실 가능한 사본이다. 재시도로 수집 경로를 막지 않는다.
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: false

service:
  extensions: [health_check, klaroauth, headers_setter]
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, klarotenant, klarousage, batch]
      exporters: [prometheus_remote_write/vm, otlp_http/live]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, klarotenant, klarousage, batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, klarotenant, klarousage, batch]
      exporters: [otlp_http/loki]
