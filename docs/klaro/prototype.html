<title>klaro — 화면 프로토타입</title>
<style>
  /* ============ 디자인 토큰 (v1 유지) ============ */
  :root {
    --bg: #F4F6FA; --surface: #FFFFFF; --surface-2: #ECF0F6;
    --border: #DCE3EC; --border-strong: #C3CDDB;
    --ink: #17202E; --ink-2: #46536B; --muted: #6B7A93;
    --accent: #2F6FED; --accent-ink: #FFFFFF; --accent-soft: #E7EEFD;
    --good: #12A150; --good-soft: #E2F5EA;
    --warn: #C6820A; --warn-soft: #FBF1DC;
    --crit: #D53A3F; --crit-soft: #FBE7E8;
    --sev-high: #C05B14;
    --s-p50: #0E9A92; --s-p95: #3B72E8; --s-p99: #8A5BD6;
    --grid: #E4E9F1;
    --shadow: 0 1px 2px rgba(23,32,46,.05), 0 4px 14px rgba(23,32,46,.06);
    --radius: 10px;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D1320; --surface: #151C2B; --surface-2: #1C2436;
      --border: #273349; --border-strong: #35435E;
      --ink: #E7EDF6; --ink-2: #AAB6CB; --muted: #7C89A3;
      --accent: #6C8CFF; --accent-ink: #0D1320; --accent-soft: #1E2A4A;
      --good: #3BC47E; --good-soft: #14301F;
      --warn: #E5A93D; --warn-soft: #33270E;
      --crit: #F26D71; --crit-soft: #3A1719;
      --sev-high: #F0935A;
      --s-p50: #2FC6BC; --s-p95: #6C8CFF; --s-p99: #B18AF2;
      --grid: #202B40;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1320; --surface: #151C2B; --surface-2: #1C2436;
    --border: #273349; --border-strong: #35435E;
    --ink: #E7EDF6; --ink-2: #AAB6CB; --muted: #7C89A3;
    --accent: #6C8CFF; --accent-ink: #0D1320; --accent-soft: #1E2A4A;
    --good: #3BC47E; --good-soft: #14301F;
    --warn: #E5A93D; --warn-soft: #33270E;
    --crit: #F26D71; --crit-soft: #3A1719;
    --sev-high: #F0935A;
    --s-p50: #2FC6BC; --s-p95: #6C8CFF; --s-p99: #B18AF2;
    --grid: #202B40;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
  :root[data-theme="light"] {
    --bg: #F4F6FA; --surface: #FFFFFF; --surface-2: #ECF0F6;
    --border: #DCE3EC; --border-strong: #C3CDDB;
    --ink: #17202E; --ink-2: #46536B; --muted: #6B7A93;
    --accent: #2F6FED; --accent-ink: #FFFFFF; --accent-soft: #E7EEFD;
    --good: #12A150; --good-soft: #E2F5EA;
    --warn: #C6820A; --warn-soft: #FBF1DC;
    --crit: #D53A3F; --crit-soft: #FBE7E8;
    --sev-high: #C05B14;
    --s-p50: #0E9A92; --s-p95: #3B72E8; --s-p99: #8A5BD6;
    --grid: #E4E9F1;
    --shadow: 0 1px 2px rgba(23,32,46,.05), 0 4px 14px rgba(23,32,46,.06);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .microlabel { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ============ 상단바 ============ */
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    height: 52px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
  .brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-flex; align-items: center; justify-content: center; color: var(--accent-ink); }
  .org-switch select {
    background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; font-size: 12.5px; font-weight: 600; font-family: inherit; cursor: pointer; max-width: 210px;
  }
  .live-chip {
    display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
    color: var(--good); background: var(--good-soft); border: 1px solid transparent;
    border-radius: 99px; padding: 3px 11px; cursor: pointer;
  }
  .live-chip.stopped { color: var(--crit); background: var(--crit-soft); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  .live-chip.stopped .live-dot { animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .topbar-spacer { flex: 1; }
  .theme-btn {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); color: var(--ink-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .theme-btn:hover { border-color: var(--border-strong); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

  /* ============ 레이아웃 ============ */
  .app { display: flex; min-height: calc(100vh - 52px); }
  .sidebar { width: 224px; flex: none; padding: 14px 10px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px; }
  .side-group { margin: 12px 8px 5px; }
  .nav-btn, .site-btn {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px;
    border: 0; border-radius: 8px; background: transparent; color: var(--ink-2);
    font-size: 13.5px; font-weight: 500; text-align: left; cursor: pointer;
  }
  .nav-btn:hover, .site-btn:hover { background: var(--surface-2); color: var(--ink); }
  .nav-btn[aria-current="page"], .site-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-btn svg { flex: none; }
  .site-btn .dot { flex: none; }
  .site-btn .s-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12.5px; }
  .site-btn .s-score { margin-left: auto; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--muted); flex: none; }
  main { flex: 1; min-width: 0; padding: 22px 26px 60px; }
  .view { max-width: 1180px; margin: 0 auto; }
  .view[hidden] { display: none; }

  .page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; margin-bottom: 16px; }
  .page-head h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .page-sub { color: var(--muted); font-size: 13px; }
  .crumbs { display: flex; gap: 7px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 10px; flex-wrap: wrap; }
  .crumbs .sep { opacity: .6; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
  .card h2 { font-size: 14px; font-weight: 650; margin: 0 0 4px; }
  .card .card-sub { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-32 { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; }
  .mt { margin-top: 14px; } .mb { margin-bottom: 14px; }

  /* ============ KPI 타일 ============ */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .kpi { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 13px 15px 13px 19px; }
  .kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--muted); }
  .kpi.is-good::before { background: var(--good); }
  .kpi.is-warn::before { background: var(--warn); }
  .kpi.is-crit::before { background: var(--crit); }
  .kpi.is-accent::before { background: var(--accent); }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .kpi-value { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 25px; font-weight: 650; letter-spacing: -.02em; margin-top: 4px; }
  .kpi-unit { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 2px; }
  .kpi-trend { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); margin-top: 3px; font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 650; border-radius: 99px; padding: 2px 9px; border: 1px solid transparent; white-space: nowrap; }
  .badge-good { color: var(--good); background: var(--good-soft); }
  .badge-warn { color: var(--warn); background: var(--warn-soft); }
  .badge-crit { color: var(--crit); background: var(--crit-soft); }
  .badge-mute { color: var(--muted); background: var(--surface-2); }
  .badge-accent { color: var(--accent); background: var(--accent-soft); }
  .badge-high { color: var(--sev-high); background: var(--warn-soft); }

  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .dot-good { background: var(--good); } .dot-warn { background: var(--warn); } .dot-crit { background: var(--crit); }
  .dot-high { background: var(--sev-high); } .dot-med { background: var(--warn); } .dot-mute { background: var(--muted); }
  .dot-accent { background: var(--accent); }
  .dot.blink { animation: pulse 1.6s ease-in-out infinite; }

  /* ============ 서브탭 ============ */
  .subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 4px 0 18px; overflow-x: auto; }
  .subtab { border: 0; background: none; padding: 9px 14px; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .subtab:hover { color: var(--ink); }
  .subtab[aria-current="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .subtab .cnt { font-family: var(--mono); font-size: 10.5px; background: var(--surface-2); border-radius: 99px; padding: 0 6px; }

  /* ============ 테이블 ============ */
  .tbl-wrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 650; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
  .tbl th.sortable { cursor: pointer; user-select: none; }
  .tbl th.sortable:hover { color: var(--ink); }
  .tbl th .arr { font-size: 9px; }
  .tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tbl tbody tr:last-child td { border-bottom: 0; }
  .tbl tbody tr.rowlink { cursor: pointer; }
  .tbl tbody tr.rowlink:hover { background: var(--surface-2); }
  .tbl tbody tr[aria-selected="true"] { background: var(--accent-soft); }
  .ta-r { text-align: right; }
  .cell-main { font-weight: 600; }
  .cell-sub { font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
  .mini-badges { display: inline-flex; gap: 5px; }
  .mini-b { font-family: var(--mono); font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 1px 6px; }
  .mini-good { color: var(--good); background: var(--good-soft); }
  .mini-warn { color: var(--warn); background: var(--warn-soft); }
  .mini-crit { color: var(--crit); background: var(--crit-soft); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; align-items: center; }
  .input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 11px; font-size: 13px; color: var(--ink); font-family: inherit; }
  select.input { cursor: pointer; }

  /* ============ 차트 ============ */
  .chart-wrap { overflow-x: auto; }
  .chart-wrap svg { display: block; width: 100%; min-width: 380px; height: auto; }
  .chart-wrap text { fill: var(--muted); font-family: var(--mono); font-size: 10.5px; }
  .chart-wrap .series-label { font-weight: 700; font-size: 11px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .spark svg { display: block; }

  .stackbar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
  .stackbar span { height: 100%; min-width: 2px; }
  .hist { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 6px; }
  .hist .hcol { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; min-width: 0; height: 100%; }
  .hist .hbar { width: 100%; background: var(--s-p95); border-radius: 3px 3px 0 0; min-height: 2px; }
  .hist .hbar.over { background: var(--crit); }
  .hist .hlabel { font-family: var(--mono); font-size: 9px; color: var(--muted); white-space: nowrap; }
  .region-row { display: grid; grid-template-columns: 76px 1fr 120px; align-items: center; gap: 10px; font-size: 12px; margin-top: 9px; }
  .region-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 4px; }
  .region-bar { position: absolute; top: 2px; bottom: 2px; left: 0; border-radius: 3px; background: var(--s-p95); }
  .region-bar.over { background: var(--crit); }

  /* ============ 서킷 브레이커 / 안내 배너 ============ */
  .cb-banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px solid var(--border); border-left: 4px solid var(--good); background: var(--surface); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow); }
  .cb-banner.is-crit { border-left-color: var(--crit); background: var(--crit-soft); }
  .cb-icon { flex: none; color: var(--good); display: inline-flex; }
  .cb-banner.is-crit .cb-icon { color: var(--crit); }
  .cb-text { flex: 1; min-width: 240px; }
  .cb-title { font-weight: 650; font-size: 13.5px; display: block; }
  .cb-desc { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; display: block; }

  /* ============ 버튼 ============ */
  .btn { display: inline-flex; align-items: center; gap: 7px; border-radius: 8px; padding: 8px 15px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); }
  .btn:hover { border-color: var(--border-strong); color: var(--ink); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.07); color: var(--accent-ink); }
  .btn-danger { color: var(--crit); border-color: var(--crit); background: transparent; }
  .btn-danger:hover { background: var(--crit-soft); color: var(--crit); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .link { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 13px; background: none; border: 0; padding: 0; cursor: pointer; }
  .link:hover { text-decoration: underline; }

  /* ============ 리포트 ============ */
  .report-hero { display: grid; grid-template-columns: 210px 1fr; gap: 24px; align-items: center; }
  .gauge-num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 700; fill: var(--ink); }
  .gauge-den { font-family: var(--mono); font-size: 12px; fill: var(--muted); }
  .verdict-scale { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
  .verdict { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); border-radius: 99px; padding: 5px 14px; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--surface-2); opacity: .55; }
  .verdict.active { opacity: 1; font-size: 14px; }
  .verdict.v-good.active { color: var(--good); background: var(--good-soft); border-color: var(--good); }
  .verdict.v-warn.active { color: var(--warn); background: var(--warn-soft); border-color: var(--warn); }
  .verdict.v-crit.active { color: var(--crit); background: var(--crit-soft); border-color: var(--crit); }
  .ai-summary { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); padding: 11px 14px; font-size: 13.5px; color: var(--ink); }
  .ai-chip { flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: var(--accent); border: 1px solid var(--accent); border-radius: 5px; padding: 1px 7px; margin-top: 2px; font-family: var(--mono); }
  .subscores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .meter-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .meter-name { font-size: 13px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
  .meter-val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; }
  .meter-track { height: 6px; border-radius: 4px; background: var(--surface-2); margin-top: 9px; overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 4px; }
  .limit-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .limit-list li { display: flex; gap: 9px; font-size: 13px; }
  .limit-list .k { color: var(--muted); flex: none; width: 96px; }
  .limit-list .v { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
  .sev-counts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .sev-pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; color: var(--ink-2); background: var(--surface); }
  .sev-pill b { font-family: var(--mono); font-size: 16px; color: var(--ink); }

  /* 워터폴 */
  .wf { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; min-width: 460px; }
  .wf-row { display: grid; grid-template-columns: 200px 1fr 74px; align-items: center; gap: 10px; font-size: 12px; }
  .wf-name { font-family: var(--mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wf-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 4px; }
  .wf-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; background: var(--s-p95); }
  .wf-bar.hot { background: var(--crit); }
  .wf-bar.dim { opacity: .35; }
  .wf-ms { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
  .wf-ms.hot { color: var(--crit); font-weight: 700; }

  /* ============ 폼 · 설정 ============ */
  .url-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 13.5px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); padding: 9px 13px; }
  .slider-row { display: grid; grid-template-columns: 110px 1fr 130px; gap: 14px; align-items: center; margin-top: 14px; }
  .slider-row label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .slider-out { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 650; text-align: right; }
  input[type="range"] { width: 100%; accent-color: var(--accent); height: 22px; }
  .usage-preview { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 16px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
  .usage-num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 700; }
  details.advanced { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
  details.advanced summary { cursor: pointer; padding: 13px 18px; font-weight: 650; font-size: 13.5px; list-style: none; display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
  details.advanced summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  details.advanced[open] summary::before { transform: rotate(90deg); }
  details.advanced .adv-body { padding: 2px 18px 16px; border-top: 1px solid var(--border); }

<script>
(function () {
  "use strict";

  /* ================= 헬퍼 ================= */
  function esc(s) {

      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];

  function fmt(n) { return Number(n).toLocaleString("ko-KR"); }
  function verdictOf(score) {

    if (score >= 70) return { cls: "warn", label: "조건부 배포 가능", icon: "⚠" };

  function miniB(v) {

  }
  function runStatusBadge(st) {
    if (st === "running") return '<span class="badge badge-accent"><span class="dot dot-accent blink"></span>실행 중</span>';

    if (st === "aborted") return '<span class="badge badge-crit">🛡 안전 종료</span>';
    return '<span class="badge badge-mute">✕ 실패</span>';
  }
  function siteStatusBadge(st) {

    if (st === "aborted") return '<span class="badge badge-crit">🛡 안전 종료</span>';
    return '<span class="badge badge-mute">○ 유휴</span>';
  }
  function sevDot(sev) {

  }
  function sevBadge(sev) {
    if (sev === "critical") return '<span class="badge badge-crit">Critical</span>';

  /* ================= 차트 빌더 (인라인 SVG) ================= */
  function sparkline(data, cls) {
    var w = 130, h = 34, min = Math.min.apply(null, data), max = Math.max.apply(null, data);
    var span = (max - min) || 1, pts = [];
    for (var i = 0; i < data.length; i++) {
      pts.push((4 + (i / (data.length - 1)) * (w - 8)).toFixed(1) + "," + (4 + (1 - (data[i] - min) / span) * (h - 8)).toFixed(1));
    }
    var last = pts[pts.length - 1].split(",");
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="점수 추세 스파크라인 (최근 ' + data.length + '회)">' +
      '<polyline fill="none" stroke="var(--' + cls + ')" stroke-width="2" stroke-linejoin="round" points="' + pts.join(" ") + '"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="3" fill="var(--' + cls + ')"/></svg>';
  }

  function lineChartSVG(el, cfg) {
    // cfg: { w,h, max, ticks:[{v,label}], series:[{d,c,label}], threshold:{v,label}, area:bool }
    var w = cfg.w, h = cfg.h, padL = 46, padR = cfg.padR || 56, padT = 14, padB = 26;
    var plotH = h - padT - padB, plotW = w - padL - padR;
    var yFor = function (v) { return padT + (1 - Math.min(v, cfg.max) / cfg.max) * plotH; };
    var s = "";
    cfg.ticks.forEach(function (t) {
      var y = yFor(t.v);
      s += '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" stroke="var(--grid)" stroke-width="1"/>';
      s += '<text x="' + (padL - 8) + '" y="' + (y + 3.5) + '" text-anchor="end">' + t.label + "</text>";
    });
    if (cfg.threshold) {
      var ty = yFor(cfg.threshold.v);
      s += '<line x1="' + padL + '" y1="' + ty + '" x2="' + (w - padR) + '" y2="' + ty + '" stroke="var(--crit)" stroke-width="1.5" stroke-dasharray="5 5"/>';
      s += '<text x="' + (w - padR + 6) + '" y="' + (ty - 5) + '" fill="var(--crit)" class="series-label">' + cfg.threshold.label + "</text>";
    }
    cfg.series.forEach(function (sr) {
      var pts = [];
      for (var i = 0; i < sr.d.length; i++) {
        pts.push((padL + (i / (sr.d.length - 1)) * plotW).toFixed(1) + "," + yFor(sr.d[i]).toFixed(1));
      }
      if (cfg.area) {
        s += '<path d="M' + padL + "," + (h - padB) + " L" + pts.join(" L") + " L" + (w - padR) + "," + (h - padB) + ' Z" fill="' + sr.c + '" opacity="0.16"/>';
      }
      s += '<polyline fill="none" stroke="' + sr.c + '" stroke-width="2" stroke-linejoin="round" points="' + pts.join(" ") + '"/>';
      var lastY = Math.max(padT + 8, Math.min(h - padB - 2, yFor(sr.d[sr.d.length - 1]) + 4));
      if (sr.label) s += '<text x="' + (w - padR + 6) + '" y="' + lastY + '" fill="' + sr.c + '" class="series-label">' + sr.label + "</text>";
      if (cfg.endDot) {
        var lp = pts[pts.length - 1].split(",");
        s += '<circle cx="' + lp[0] + '" cy="' + lp[1] + '" r="4" fill="' + sr.c + '" stroke="var(--surface)" stroke-width="2"/>';
      }
    });
    el.innerHTML = s;
  }

  function barsSVG(el, days, warnFrom) {
    var w = 680, h = 210, padL = 50, padR = 14, padT = 12, padB = 30;
    var max = Math.max.apply(null, days) * 1.15;
    var plotW = w - padL - padR, plotH = h - padT - padB;
    var bw = plotW / days.length - 6;
    var s = "";
    [0, 1000, 2000, 3000].forEach(function (v) {
      var y = padT + (1 - v / max) * plotH;
      s += '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" stroke="var(--grid)"/>';
      s += '<text x="' + (padL - 8) + '" y="' + (y + 3.5) + '" text-anchor="end">' + fmt(v) + "</text>";
    });
    days.forEach(function (v, i) {
      var x = padL + i * (plotW / days.length) + 3;
      var bh = (v / max) * plotH;
      var c = i >= warnFrom ? "var(--warn)" : "var(--accent)";
      s += '<rect x="' + x.toFixed(1) + '" y="' + (padT + plotH - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="' + c + '"/>';
      s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - padB + 14) + '" text-anchor="middle">' + (i + 1) + "일</text>";
    });

  }

      '<circle cx="80" cy="80" r="64" fill="none" stroke="var(--surface-2)" stroke-width="14"/>' +
      '<circle cx="80" cy="80" r="64" fill="none" stroke="var(--' + colorVar + ')" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + dash.toFixed(1) + ' 402.1" transform="rotate(-90 80 80)"/>' +
      '<text x="80" y="82" text-anchor="middle" class="gauge-num">' + score + "</text>" +
      '<text x="80" y="102" text-anchor="middle" class="gauge-den">/ 100</text></svg>';

  function crumbLoad(s, label) {

  function seriesFor(run) {
    var n = 40, p50 = [], p95 = [], p99 = [], vu = [], rps = [];
    var peak95 = run.p95 || 1500, base50 = run.p50 || peak95 * 0.2, baseRps = run.rps || run.vu * 3;
    for (var i = 0; i < n; i++) {
      var t = i / (n - 1), ramp = Math.min(1, t / 0.4);
      var w = Math.sin(i * 1.7) * 0.06 + Math.sin(i * 0.6) * 0.04;
      vu.push(Math.round(run.vu * ramp));
      p95.push(peak95 * (0.45 + 0.55 * t) * (1 + w));
      p50.push(base50 * (0.7 + 0.3 * t) * (1 + w * 0.5));
      p99.push(peak95 * 1.55 * (0.45 + 0.55 * t) * (1 + w));
      rps.push(baseRps * (0.25 + 0.75 * ramp) * (1 + w * 0.8));
    }
    return { p50: p50, p95: p95, p99: p99, vu: vu, rps: rps };
  }

        '<td class="ta-r num">' + fmt(e[5]) + "ms</td>" +

    if (liveMode) {

        '<span class="cb-desc" id="cbDesc">대상 에러율이 임계 80%를 초과하면 테스트를 자동으로 안전하게 중단합니다. 당신의 서버를 보호하기 위한 장치예요.</span></span>' +
        '<button class="btn btn-danger" id="abortBtn" type="button" data-action="abort">중단 시뮬레이션</button></div>';

  function liveKpi(id, label, value, unit, cls, delta) {
    var badgeTxt = cls === "good" ? "● 정상" : cls === "warn" ? "⚠ 경고" : cls === "crit" ? "✕ 위험" : "○ 종료";

  function shieldOk() { return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>'; }
  function shieldX() { return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M15 9l-6 6M9 9l6 6"/></svg>'; }

  function renderRunDetail(s) {
    var run = s.runs.filter(function (r) { return r.id === state.load.runId; })[0] || s.runs[0];

  function drawRunCharts(sr, run) {
    var latMax = Math.max(3200, (run.p95 || 2000) * 1.9);
    lineChartSVG($("latencyChart"), {
      w: 720, h: 250, max: latMax,
      ticks: [0, 1000, 2000, 3000].concat(latMax > 4500 ? [4000, 5000] : []).map(function (v) { return { v: v, label: v === 0 ? "0" : (v / 1000).toFixed(1) + "s" }; }),
      threshold: { v: 2000, label: "임계" },
      series: [{ d: sr.p99, c: "var(--s-p99)", label: "P99" }, { d: sr.p95, c: "var(--s-p95)", label: "P95" }, { d: sr.p50, c: "var(--s-p50)", label: "P50" }]
    });
    var vuMax = Math.ceil(run.vu * 1.2 / 100) * 100;
    lineChartSVG($("vuChart"), {
      w: 460, h: 250, max: vuMax, padR: 14, area: true, endDot: true,
      ticks: [0, vuMax / 3, (vuMax / 3) * 2, vuMax].map(function (v) { return { v: v, label: fmt(Math.round(v)) }; }),
      series: [{ d: sr.vu, c: "var(--accent)" }]
    });
    var rpsMax = Math.max.apply(null, sr.rps) * 1.25;
    lineChartSVG($("rpsChart"), {
      w: 560, h: 220, max: rpsMax, padR: 14,
      ticks: [0, rpsMax / 3, (rpsMax / 3) * 2].map(function (v) { return { v: v, label: fmt(Math.round(v / 100) * 100) }; }),
      series: [{ d: sr.rps, c: "var(--s-p50)" }]

  }

  /* ---- 실행 비교 ---- */
  function renderCompare(s) {
    var a = s.runs.filter(function (r) { return r.id === state.load.cmpA; })[0];

    function row(name, va, vb, unit, lowerBetter, digits) {
      if (va == null || vb == null) return "";
      var diff = va - vb, improved = lowerBetter ? diff < 0 : diff > 0, same = Math.abs(diff) < 0.0001;
      var cls = same ? "muted" : improved ? "good" : "crit";
      var arrow = same ? "＝" : diff > 0 ? "▲" : "▼";
      var dTxt = (diff > 0 ? "+" : "") + (digits != null ? diff.toFixed(digits) : fmt(Math.round(diff)));
      return "<tr><td class=\"cell-main\">" + name + '</td><td class="ta-r num">' + (digits != null ? va.toFixed(digits) : fmt(va)) + unit + "</td>" +
        '<td class="ta-r num">' + (digits != null ? vb.toFixed(digits) : fmt(vb)) + unit + "</td>" +
        '<td class="ta-r num" style="color:var(--' + cls + ');font-weight:700">' + arrow + " " + dTxt + unit + " " + (same ? "" : improved ? "개선" : "악화") + "</td></tr>";
    }
    var h = crumbLoad(s, "비교 " + a.id + " ⇄ " + b.id);
    h += '<div class="page-head"><h1 style="font-size:17px">실행 비교</h1><span class="page-sub num">' + a.id + " (" + a.date + ") vs " + b.id + " (" + b.date + ")</span></div>";
    h += '<div class="card mb"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>지표</th><th class="ta-r">' + a.id + '</th><th class="ta-r">' + b.id + '</th><th class="ta-r">변화 (' + a.id + " 기준)</th></tr></thead><tbody>" +
      row("동시 사용자(VU)", a.vu, b.vu, "", false) +
      row("평균 RPS", a.rps, b.rps, "", false) +
      row("P50 지연", a.p50, b.p50, "ms", true) +
      row("P95 지연", a.p95, b.p95, "ms", true) +
      row("P99 지연", a.p99, b.p99, "ms", true) +
      row("에러율", a.err, b.err, "%", true, 1) +
      row("배포 점수", a.score, b.score, "", false) +
      "</tbody></table></div></div>";
    h += '<div class="ai-summary mb"><span class="ai-chip">AI · Bedrock</span><span>“VU를 ' + fmt(a.vu - b.vu) + " 늘렸음에도 P95 상승은 " +
      Math.round(((a.p95 - b.p95) / b.p95) * 100) + "%에 그침 — 스케일 여유가 있으나, 에러율 증가 추세는 " + esc(s.limit.ep) + " 병목과 상관.”</span></div>";
    h += '<button class="btn" type="button" data-action="tab" data-tab="load">← 목록으로</button>';
    $("siteBody").innerHTML = h;
  }

  var FREE_REMAIN = 1000; // 데모: 남은 무료 한도 VU-Min
  function updateUsagePreview() {
    var vuS = $("vuSlider"), durS = $("durSlider");
    if (!vuS) return;
    var v = +vuS.value, d = +durS.value, usage = v * d;
    $("vuOut").textContent = fmt(v) + " VU";
    $("durOut").textContent = d + "분";

    } else {
      badge.className = "badge badge-good";
      badge.textContent = "● 남은 한도 내 (" + fmt(FREE_REMAIN) + " VU-Min)";

  /* ---- 보안 탭 ---- */
  function renderSecurity(s) {
    var eng = state.sec.eng, sev = state.sec.sev;
    var open = s.findings.filter(function (f) { return f.st === "open"; });
    var engs = [["all", "전체 엔진"], ["SAST", "SAST (Semgrep)"], ["DAST", "DAST (ZAP)"], ["DEP", "의존성 (osv-scanner)"]];
    var h = '<div class="subtabs" style="margin-top:0">' + engs.map(function (e) {
      var cnt = e[0] === "all" ? open.length : open.filter(function (f) { return f.eng === e[0]; }).length;
      return '<button class="subtab" type="button" data-action="sec-eng" data-eng="' + e[0] + '"' + (eng === e[0] ? ' aria-current="true"' : "") + ">" + e[1] + ' <span class="cnt num">' + cnt + "</span></button>";
    }).join("") + "</div>";

    var sevs = [["all", "전체", null], ["critical", "Critical", "crit"], ["high", "High", "high"], ["medium", "Medium", "med"], ["ignored", "무시됨", "mute"]];
    h += '<div class="chips" role="group" aria-label="심각도 필터">' + sevs.map(function (c) {
      var cnt;
      if (c[0] === "all") cnt = open.length;
      else if (c[0] === "ignored") cnt = s.findings.length - open.length;
      else cnt = open.filter(function (f) { return f.sev === c[0]; }).length;
      return '<button class="chip" type="button" data-action="sec-sev" data-sev="' + c[0] + '" aria-pressed="' + (sev === c[0]) + '">' +
        (c[2] ? '<span class="dot dot-' + c[2] + '" aria-hidden="true"></span>' : "") + c[1] + ' <span class="cnt">' + cnt + "</span></button>";
    }).join("") + "</div>";

    var list = s.findings.filter(function (f) {
      if (sev === "ignored") { if (f.st !== "ignored") return false; }
      else if (f.st === "ignored") return false;
      else if (sev !== "all" && f.sev !== sev) return false;
      if (eng !== "all" && f.eng !== eng) return false;
      return true;
    });
    h += '<div class="finding-list">';

        '<span class="f-loc">' + esc(f.loc) + "</span>" +
        '<span class="f-desc">' + esc(ignored ? "무시 사유: " + f.fix : f.desc) + "</span></span>" +
        '<span class="link" aria-hidden="true">상세 →</span></button>';
    });
    h += "</div>";
    $("siteBody").innerHTML = h;
  }

    var codeLines = [
      ["40", "router.get('/users', async (req, res) => {"],

      '<p style="margin:0 0 10px"><span class="badge badge-good">✓ 링크가 생성되었습니다</span></p>' +
      '<div class="url-row"><span>https://app.klaro.io/shared/r_ab12cd</span><button class="link" type="button" data-action="copy">복사</button></div>' +
      '<p class="card-sub" style="margin:10px 0 0">만료: ' + esc(exp) + ($("shPw").value ? " · 비밀번호 보호됨" : " · 비밀번호 없음") + " · 폐기는 리포트 목록에서 가능합니다.</p>" +
      '<div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn" type="button" data-action="close-modal">닫기</button></div>';
  }

  /* ================= 라이브 시뮬레이션 (payments #128) ================= */
  var SIM = { aborted: false, timer: null, elapsed: 192, err: 2.0, rps: 4210, p50: [], p95: [], p99: [], vu: [], rpsArr: [] };
  var N = 40, LAT_MAX = 3200, THRESHOLD = 2000;
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  (function seed() {
    for (var i = 0; i < N; i++) {
      var t = i / (N - 1), ramp = Math.min(1, t / 0.45);
      SIM.vu.push(Math.round(1000 * ramp + rand(-12, 12) * ramp));
      SIM.p50.push(260 + 80 * t + rand(-25, 25));
      SIM.p95.push(950 + 880 * t + rand(-70, 70));
      SIM.p99.push(1500 + 1350 * t + rand(-110, 110));
      SIM.rpsArr.push(Math.round(4200 * (0.3 + 0.7 * ramp) + rand(-100, 100)));
    }
  })();

  function drawLiveCharts() {
    if (!$("latencyChart")) return;
    lineChartSVG($("latencyChart"), {
      w: 720, h: 250, max: LAT_MAX,
      ticks: [0, 1000, 2000, 3000].map(function (v) { return { v: v, label: v === 0 ? "0" : (v / 1000).toFixed(1) + "s" }; }),
      threshold: { v: THRESHOLD, label: "임계" },
      series: [{ d: SIM.p99, c: "var(--s-p99)", label: "P99" }, { d: SIM.p95, c: "var(--s-p95)", label: "P95" }, { d: SIM.p50, c: "var(--s-p50)", label: "P50" }]
    });
    lineChartSVG($("vuChart"), {
      w: 460, h: 250, max: 1200, padR: 14, area: true, endDot: true,
      ticks: [0, 400, 800, 1200].map(function (v) { return { v: v, label: fmt(v) }; }),
      series: [{ d: SIM.vu, c: "var(--accent)" }]
    });
    lineChartSVG($("rpsChart"), {
      w: 560, h: 220, max: 6000, padR: 14,
      ticks: [0, 2000, 4000, 6000].map(function (v) { return { v: v, label: fmt(v) }; }),
      series: [{ d: SIM.rpsArr, c: "var(--s-p50)" }]
    });
  }

  function setKpi(id, valueHtml, cls, badgeText, deltaText) {
    var el = $(id);
    if (!el) return;
    el.classList.remove("is-good", "is-warn", "is-crit", "is-mute");
    el.classList.add("is-" + cls);
    el.querySelector("[data-value]").innerHTML = valueHtml;
    var badge = el.querySelector("[data-badge]");
    badge.className = "badge badge-" + cls;
    badge.textContent = badgeText;
    el.querySelector("[data-delta]").textContent = deltaText;
  }
  function fmtElapsed(sec) {
    sec = Math.min(sec, 300);
    var m = Math.floor(sec / 60), s2 = Math.floor(sec % 60);
    return (m < 10 ? "0" : "") + m + ":" + (s2 < 10 ? "0" : "") + s2;
  }

  function tick() {
    if (SIM.aborted) return;
    SIM.vu.shift(); SIM.vu.push(Math.round(1000 + rand(-10, 10)));
    var last95 = SIM.p95[SIM.p95.length - 1];
    var next95 = Math.max(1400, Math.min(2150, last95 + rand(-90, 110)));
    SIM.p95.shift(); SIM.p95.push(next95);
    SIM.p50.shift(); SIM.p50.push(Math.max(240, Math.min(480, SIM.p50[SIM.p50.length - 1] + rand(-30, 32))));
    SIM.p99.shift(); SIM.p99.push(Math.max(next95 + 500, Math.min(3150, SIM.p99[SIM.p99.length - 1] + rand(-140, 160))));
    SIM.rps = Math.round(Math.max(3600, Math.min(4800, SIM.rps + rand(-120, 130))));
    SIM.rpsArr.shift(); SIM.rpsArr.push(SIM.rps);
    SIM.err = Math.max(0.4, Math.min(4.5, SIM.err + rand(-0.4, 0.42)));
    SIM.elapsed += 1.6;

    // 현재 화면이 라이브 실행 상세일 때만 DOM 갱신
    if (!$("abortBtn")) return;
    var p95Cls = next95 >= THRESHOLD ? "crit" : next95 >= 1500 ? "warn" : "good";
    setKpi("kpiVu", fmt(SIM.vu[SIM.vu.length - 1]), "good", "● 정상", "목표 1,000 도달");
    setKpi("kpiRps", fmt(SIM.rps), "good", "● 정상", (SIM.rps >= 4210 ? "+" : "−") + Math.abs(((SIM.rps - 4210) / 4210) * 100).toFixed(1) + "% (최근 30초)");
    setKpi("kpiP95", (next95 / 1000).toFixed(2) + '<span class="kpi-unit">s</span>', p95Cls,
      p95Cls === "crit" ? "✕ 임계 초과" : p95Cls === "warn" ? "⚠ 경고" : "● 정상",
      p95Cls === "crit" ? "임계 2.0s 초과!" : "임계 2.0s 근접");
    setKpi("kpiErr", SIM.err.toFixed(1) + '<span class="kpi-unit">%</span>', SIM.err < 5 ? "good" : "warn", "● 정상", "임계 80% 이내");
    if ($("elapsed")) $("elapsed").textContent = fmtElapsed(SIM.elapsed);
    if ($("sb5")) { // 응답 코드 분포 라이브 반영
      var c5 = SIM.err.toFixed(1), c4 = 4.1, c2 = (100 - c4 - c5).toFixed(1);
      $("sb2").style.width = c2 + "%"; $("sb5").style.width = c5 + "%";
      $("sbT2").textContent = c2 + "%"; $("sbT5").textContent = c5 + "%";
    }
    drawLiveCharts();
  }

  function doAbort() {
    if (SIM.aborted) return;
    SIM.aborted = true;
    if (SIM.timer) clearInterval(SIM.timer);
    var pay = site("payments");
    pay.status = "aborted";
    pay.lastRun = "지금 · #128 서킷 브레이커 발동";
    var r128 = pay.runs[0];
    r128.status = "aborted"; r128.live = false; r128.err = 84; r128.p95 = 2860; r128.p50 = 520; r128.p99 = 4400; r128.rps = 0; r128.score = 61;
    DB.org.activeTests = 0;
    var banner = $("cbBanner");
    if (banner) {
      banner.classList.add("is-crit");
      $("cbTitle").textContent = "서킷 브레이커 발동 — 테스트를 안전하게 중단했어요";
      $("cbDesc").textContent = "에러율 84%가 임계(80%)를 초과했습니다. 사고가 아니라 대상 서버를 보호하기 위한 자동 중단이에요. 지금까지의 부분 결과는 보존되어 리포트에 포함됩니다.";
      banner.querySelector(".cb-icon").innerHTML = shieldX();
      var btn = $("abortBtn");
      btn.disabled = true; btn.textContent = "중단됨";
      setKpi("kpiErr", '84.0<span class="kpi-unit">%</span>', "crit", "✕ 위험", "임계 80% 초과 — 자동 중단");
      setKpi("kpiVu", "0", "crit", "✕ 중단", "워커 회수 완료");
      setKpi("kpiRps", "0", "crit", "✕ 중단", "트래픽 종료");
    }
    var chip = $("liveChip");
    chip.classList.add("stopped");
    $("liveChipText").textContent = "중단됨 · 부분 결과 보존";
    renderSidebar();
    toast("서킷 브레이커 발동 — 대상 서버를 보호하기 위해 테스트를 안전하게 중단했어요. 부분 결과는 보존됩니다.", true);
  }

  /* ================= 토스트 ================= */
  var toastTimer = null;
  function toast(msg, crit) {
    var t = $("toast");
    t.classList.toggle("t-crit", !!crit);
    $("toastIcon").innerHTML = crit
      ? '<span style="color:var(--crit)">' + shieldX() + "</span>"
      : '<span style="color:var(--accent)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg></span>';
    $("toastMsg").textContent = msg;
    t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 5000);
  }

  /* ================= 테마 토글 ================= */
  function effectiveTheme() {
    return root.dataset.theme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function syncThemeBtn() {
    var dark = effectiveTheme() === "dark";
    $("iconSun").hidden = !dark;
    $("iconMoon").hidden = dark;
    $("themeLabel").textContent = dark ? "라이트" : "다크";
  }

  /* ================= 이벤트 위임 ================= */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("[data-action]") : null;
    if (!t) return;
    var a = t.dataset.action;
    switch (a) {
      case "nav-home": goHome(); break;
      case "nav-usage": goUsage(); break;
      case "nav-site": goSite(t.dataset.site, "overview"); break;
      case "tab":
        if (t.dataset.tab === "load") state.load.mode = "list";
        if (t.dataset.tab === "reports") state.rep.mode = "list";
        state.tab = t.dataset.tab; render(); break;
      case "open-run": state.tab = "load"; state.load.mode = "run"; state.load.runId = t.dataset.run; render(); break;
      case "open-compare": state.tab = "load"; state.load.mode = "compare"; state.load.cmpA = t.dataset.a; state.load.cmpB = t.dataset.b; render(); break;
      case "open-new": state.tab = "load"; state.load.mode = "new"; render(); break;
      case "sort-ep":
        var k = +t.dataset.key;
        if (state.epSort.key === k) state.epSort.dir *= -1;
        else { state.epSort.key = k; state.epSort.dir = k >= 2 ? -1 : 1; }
        render(); break;
      case "sec-eng": state.sec.eng = t.dataset.eng; render(); break;
      case "sec-sev": state.sec.sev = t.dataset.sev; render(); break;
      case "open-finding": openFinding(t.dataset.fid); break;
      case "close-slide": closeSlide(); break;
      case "ignore-finding": {
        var s1 = site(state.siteId), f1 = s1.findings.filter(function (x) { return x.id === t.dataset.fid; })[0];
        if (f1) { f1.st = "ignored"; s1.counts.ignored++; if (f1.sev === "critical") s1.counts.crit--; else if (f1.sev === "high") s1.counts.high--; else s1.counts.med--; }
        closeSlide(); render(); toast("무시 처리되었습니다 — 사유가 기록되고 재스캔에도 유지됩니다."); break;
      }
      case "unignore-finding": {
        var s2 = site(state.siteId), f2 = s2.findings.filter(function (x) { return x.id === t.dataset.fid; })[0];
        if (f2) { f2.st = "open"; s2.counts.ignored--; if (f2.sev === "critical") s2.counts.crit++; else if (f2.sev === "high") s2.counts.high++; else s2.counts.med++; }
        closeSlide(); render(); toast("무시가 해제되었습니다."); break;
      }
      case "sel-trace": state.apm.traceId = t.dataset.tid; render(); break;
      case "log-lvl": state.apm.lvl = t.dataset.lvl; render(); break;
      case "open-report": state.tab = "reports"; state.rep.mode = "detail"; state.rep.reportId = t.dataset.rid || null; render(); break;
      case "rep-back": state.rep.mode = "list"; render(); break;
      case "open-share": ev.stopPropagation(); openShare(); break;
      case "close-modal": $("modal").classList.remove("show"); break;
      case "gen-share": genShare(); break;
      case "sdk-tab": state.sdk = t.dataset.sdk; renderSettings(site(state.siteId)); break;
      case "abort": doAbort(); break;
      case "add-step": state.steps.push({ m: "GET", p: "/", b: "" }); renderSteps(); break;
      case "del-step": state.steps.splice(+t.dataset.idx, 1); renderSteps(); break;
      case "start-test": state.load.mode = "list"; render(); toast("테스트가 시작 대기열에 등록되었습니다 — 워커 프로비저닝 후 자동 시작됩니다."); break;
      case "goto-live": {
        var pay2 = site("payments");
        goSite("payments", "load");
        state.load.mode = "run"; state.load.runId = pay2.runs[0].id; render(); break;
      }
      case "revoke-key": toast("API 키가 폐기되었습니다 — 해당 키의 요청은 즉시 거부됩니다."); break;
      case "copy": toast("클립보드에 복사되었습니다. (프로토타입 — 실제 복사 없음)"); break;
    }
  });

  // 행(role=button) 키보드 접근
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { closeSlide(); $("modal").classList.remove("show"); return; }
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.getAttribute && ev.target.getAttribute("role") === "button" && ev.target.tagName === "TR") {
      ev.preventDefault(); ev.target.click();
    }
  });

  // 입력 위임
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (el.id === "homeSearch") { state.home.q = el.value; renderHome(); }
    else if (el.id === "logSearch") { state.apm.q = el.value; state.apm.qFocus = true; render(); }
    else if (el.id === "vuSlider" || el.id === "durSlider") updateUsagePreview();
    else if (el.dataset && el.dataset.sf) { state.steps[+el.dataset.si][el.dataset.sf] = el.value; }
  });
  document.addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.id === "homeStatus") { state.home.st = el.value; renderHome(); }
    else if (el.id === "homeSort") { state.home.sort = el.value; renderHome(); }
    else if (el.id === "prScan") toast(el.checked ? "PR 자동 스캔이 켜졌습니다." : "PR 자동 스캔이 꺼졌습니다.");
  });

  $("themeToggle").addEventListener("click", function () {
    root.dataset.theme = effectiveTheme() === "dark" ? "light" : "dark";
    syncThemeBtn();
  });

  /* ================= 초기화 ================= */
  syncThemeBtn();
  render();
  if (!REDUCED) SIM.timer = setInterval(tick, 1600);
})();
</script>
